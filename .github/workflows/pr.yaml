name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  before_commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install just
        run: cargo install just

      - name: Run before_commit
        run: just before_commit
