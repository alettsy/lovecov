[package]
name = "lovecov"
description = "A simple, cross-platform lcov parser for generating various output formats"
version = "1.0.0"
authors = ["Alex Betts (alettsy)"]
edition = "2024"
readme = "README.md"
license = "MIT"
repository = "https://github.com/alettsy/lovecov"
homepage = "https://github.com/alettsy/lovecov"
categories = ["command-line-utilities"]
keywords = ["lcov", "coverage", "code-coverage", "cli"]

[[bin]]
name = "lovecov"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
