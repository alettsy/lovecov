[package]
name = "lovecov"
description = "A simple, cross-platform lcov parser for generating various output formats"
version = "0.1.0"
edition = "2024"
readme = "README.md"
license = "MIT"
repository = "https://github.com/alettsy/lovecov"
keywords = ["lcov", "genhtml", "cli", "tool"]
categories = ["command-line-utilities"]

[[bin]]
name = "lovecov"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
